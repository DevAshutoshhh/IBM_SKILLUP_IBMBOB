# Netlify deployment for SaathiSetu.
# The app is a static single-page build with hash routing, so the only rule
# needed is to serve index.html for any path.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served from a stale cache, or a deploy
# would not reach people who already installed the app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
